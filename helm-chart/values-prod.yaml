route:
  host: support.les-tilleuls.coop
  extraHosts: 
    - itop.lt-mut-prod-scw.les-tilleuls.solutions
image:
  repository: rg.fr-par.scw.cloud/infra-mut-cr-scw/itop-apache
  tag: prod-0.9.9

# Secret de pull du registry privé Scaleway, créé par argocd_sites.tf dans ce namespace (même
# convention que le chart otterwiki).
imagePullSecrets:
  - name: regcred

# Standby par défaut : ni l'app ni la base ne tournent tant qu'on n'a pas explicitement besoin de
# tester (repasser replicaCount à 1 et mariadb.instance.suspend à false le temps du test, puis
# revert). Les PVC (app + mariadb) restent créés et conservent leurs données pendant la suspension.
replicaCount: 1

mariadb:
  instance:
    suspend: false
  auth:
    existingSecret: itop-mariadb-auth
  # Metabase (coopTilleuls/metabase, namespace prod-metabase) queries the iTop database.
  extraIngressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prod-metabase
      podSelector:
        matchLabels:
          app: metabase
          release: metabase
  # Its password is in the Secret itop-mariadb-metabase-auth, to copy into Metabase's data source.
  readOnlyUsers:
    - metabase
  backup:
    enabled: true
    # Base suspendue par défaut (cf. instance.suspend ci-dessus) : pas de pod à sauvegarder, donc
    # pas de schedule -- repasser à false en même temps que instance.suspend le temps du test.
    schedule:
      suspend: false
    maxRetention: "72h" # 3 jours
    storage:
      s3:
        bucket: lt-mut-prod-scw-itop-mariadb-backup
