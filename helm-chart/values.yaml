# Default values for itop-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: supervisions/itop
  pullPolicy: Always
  tag: "3.0"

# Only used when mariadb.enabled is false, to point iTop at an externally managed database.
environment:
  db_host: <mysql-server-url> "mysql-chart.database.svc.cluster.local"
  db_name: <mysql-db-name>
  db_pwd: <mysql-db-pwd>
  db_user: <mysql-db-user>

# Dedicated MariaDB instance provisioned via the mariadb-operator
# (https://github.com/mariadb-operator/mariadb-operator), already installed on the
# lt-mut-nonprod-scw and lt-mut-prod-scw clusters. When enabled, this takes precedence
# over the `environment.db_*` values above.
mariadb:
  enabled: true
  instance:
    image: mariadb:11.4.3
    replicas: 1
    port: 3306
    storage:
      size: 10Gi
      storageClassName: standard
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
  database:
    name: itop
    characterSet: utf8mb4
    collate: utf8mb4_unicode_ci
  auth:
    username: itop
    # Name of an existing secret with "root-password" and "password" keys.
    # Leave empty to let the chart generate and manage one automatically.
    existingSecret: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

container:
  port: 80
podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

pvc:
  accessMode: ReadWriteOnce
  storageClassName: standard
  conf:
    size: 1Gi
  data:
    size: 10Gi
  env:
    size: 1Gi
  log:
    size: 1Gi
  ext:
    size: 1Gi

service:
  type: ClusterIP
  port: 80
  targetPort: 80

route:
  enabled: true
  gateway:
    # -- Name of the (pre-existing) Gateway this HTTPRoute attaches to.
    name: traefik
    # -- Set when the Gateway lives in a different namespace than this release. Requires a ReferenceGrant in
    # that namespace allowing HTTPRoutes from this release's namespace to attach (created alongside the Gateway,
    # not by this chart).
    namespace: infra-traefik
    # -- Restrict attachment to one specific listener on the Gateway (e.g. a dedicated HTTPS listener), leave
    # empty to attach to every listener that allows it.
    sectionName: https
  # -- Free-form, in case the HTTPRoute itself ever needs annotations (rare with Gateway API)
  annotations: {}
  host: itop.<your-host>
  # -- Additional hostnames routed to the same backend (e.g. a bare/www alias)
  extraHosts: []

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
