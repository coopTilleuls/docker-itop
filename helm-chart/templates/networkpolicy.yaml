apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app
  labels:
    {{- include "itop-chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "itop-chart.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              service: ingress
      ports:
        - port: {{ .Values.container.port }}
          protocol: TCP
  egress:
    {{- if .Values.mariadb.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mariadb
              app.kubernetes.io/instance: {{ include "itop-chart.mariadb.fullname" . }}
      ports:
        - port: {{ .Values.mariadb.instance.port }}
          protocol: TCP
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 465
          protocol: TCP
