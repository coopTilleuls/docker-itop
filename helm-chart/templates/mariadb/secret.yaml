{{- if and .Values.mariadb.enabled (not .Values.mariadb.auth.existingSecret) }}
{{- $secretName := include "itop-chart.mariadb.secretName" . }}
{{- $fullName := include "itop-chart.mariadb.fullname" . }}
---
# Generates both passwords once, via ESO, instead of a `lookup`-based "read back the existing
# Secret": `lookup` doesn't work through ArgoCD, which renders with plain `helm template` (no
# live cluster access, lookup always returns nil there) -- every sync used to mint a fresh random
# password, desyncing it from the one MariaDB had already set on the root/itop DB users. Same
# pattern as vis-mon-metier-helm-chart/templates/cnpg-role-secrets.yaml.
# refreshPolicy: CreatedOnce + target.immutable are both required: the Password generator itself
# has no persisted state, so without these ESO would happily regenerate it just as often as
# `lookup` used to fail.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $fullName }}-root-password
  labels:
    {{- include "itop-chart.labels" . | nindent 4 }}
spec:
  length: 32
  symbols: 0
  symbolCharacters: ""
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $fullName }}-password
  labels:
    {{- include "itop-chart.labels" . | nindent 4 }}
spec:
  length: 32
  symbols: 0
  symbolCharacters: ""
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "itop-chart.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    immutable: true
    template:
      type: Opaque
      data:
        root-password: {{ `{{ .rootPassword }}` | quote }}
        password: {{ `{{ .password }}` | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $fullName }}-root-password
      rewrite:
        - regexp:
            source: "password"
            target: "rootPassword"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $fullName }}-password
{{- end }}
