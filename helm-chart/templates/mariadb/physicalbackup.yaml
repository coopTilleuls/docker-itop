{{- if and .Values.mariadb.enabled .Values.mariadb.backup.enabled }}
apiVersion: k8s.mariadb.com/v1alpha1
kind: PhysicalBackup
metadata:
  name: {{ include "itop-chart.mariadb.fullname" . }}
  labels:
    {{- include "itop-chart.labels" . | nindent 4 }}
spec:
  mariaDbRef:
    name: {{ include "itop-chart.mariadb.fullname" . }}
  # Distinguishes the backup Job's pods from the rest of the release so the NetworkPolicy in
  # networkpolicy.yaml can grant them egress (DNS, MariaDB, S3) -- without this label they'd only
  # carry generic batch.kubernetes.io/job-name labels and fall under the namespace's default-deny.
  podMetadata:
    labels:
      app.kubernetes.io/component: mariadb-backup
      app.kubernetes.io/instance: {{ include "itop-chart.mariadb.fullname" . }}
  target: {{ .Values.mariadb.backup.target }}
  compression: {{ .Values.mariadb.backup.compression }}
  {{- if .Values.mariadb.backup.maxRetention }}
  maxRetention: {{ .Values.mariadb.backup.maxRetention | quote }}
  {{- end }}
  schedule:
    cron: {{ .Values.mariadb.backup.schedule.cron | quote }}
    suspend: {{ .Values.mariadb.backup.schedule.suspend }}
  storage:
    s3:
      bucket: {{ .Values.mariadb.backup.storage.s3.bucket }}
      endpoint: {{ .Values.mariadb.backup.storage.s3.endpoint }}
      region: {{ .Values.mariadb.backup.storage.s3.region }}
      # Without this, mariadb-operator defaults to plain HTTP to reach S3, which the
      # allow-database-backup NetworkPolicy (egress port 443 only) blocks.
      tls:
        enabled: true
      accessKeyIdSecretKeyRef:
        name: {{ .Values.mariadb.backup.storage.s3.existingSecret }}
        key: ACCESS_KEY_ID
      secretAccessKeySecretKeyRef:
        name: {{ .Values.mariadb.backup.storage.s3.existingSecret }}
        key: ACCESS_SECRET_KEY
{{- end }}
