apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-app-mailgun
  labels:
    {{- include "itop-chart.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "itop-chart.selectorLabels" . | nindent 6 }}
  egress:
    # DNS lookup needed for Cilium to learn the IP(s) behind the FQDN rule below.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: "smtp.eu.mailgun.org"
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
