name: Build

on:
  workflow_call:
    inputs:
      tags:
        type: string
        description: The Docker Tags (see docker/metadata-action@v5 for available values)
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Scaleway Container Registry
      uses: docker/login-action@v3
      with:
        registry: rg.fr-par.scw.cloud
        username: ${{ secrets.SCW_USERNAME }}
        password: ${{ secrets.SCW_SECRET_KEY }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: rg.fr-par.scw.cloud/infra-mut-cr-scw/itop-apache
        tags: ${{ inputs.tags }}

    - name: Build/Push
      uses: docker/build-push-action@v6
      with:
        context: 3.2-custum
        tags: ${{ steps.meta.outputs.tags }}
        push: true
        cache-from: |
          type=gha,scope=${{ github.ref }}
          type=gha,scope=refs/heads/main
        cache-to: |
          type=gha,scope=${{ github.ref }},mode=max
