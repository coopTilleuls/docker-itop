name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Lint and render the chart for each environment
        run: |
          set -euo pipefail
          for values in helm-chart/values-nonprod.yaml helm-chart/values-prod.yaml; do
            echo "::group::${values}"
            helm lint helm-chart --values "${values}"
            helm template itop helm-chart --values "${values}" > /dev/null
            echo "::endgroup::"
          done

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same context as build.yml, without pushing: checks the image still builds.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: 3.2-custum
          push: false
